server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy reverso para a API do backend.
    # Os headers Upgrade/Connection são necessários para WebSocket (terminal das VMs).
    # Para requisições HTTP normais eles são ignorados — uma configuração serve ambos.
    location /api/ {
        proxy_pass         http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA fallback — necessário para rotas do Next.js com output: export
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}
