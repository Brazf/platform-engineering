openapi: 3.0.3
info:
  title: ProxLab API
  description: >-
    API para criação e gerenciamento de VMs no Proxmox VE via interface simplificada.
    Usuários `aluno` (limites menores) e `pesquisador` (limites maiores).
  version: "1.0"
servers:
  - url: /api
tags:
  - name: auth
    description: Autenticação de usuários
  - name: vms
    description: Criação e gerenciamento de VMs no Proxmox
  - name: containers
    description: Containers de aplicação no cluster k3s

paths:
  /auth/register:
    post:
      tags: [auth]
      summary: Cadastrar novo usuário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Usuário criado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: Payload inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: E-mail já está em uso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Perfil (role) inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      tags: [auth]
      summary: Autenticar usuário e obter token JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login efetuado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Payload inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: E-mail ou senha inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /vms:
    post:
      tags: [vms]
      summary: Criar uma nova VM no Proxmox
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVMRequest"
      responses:
        "201":
          description: VM criada (provisionamento iniciado)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateVMResponse"
        "400":
          description: Payload inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Limite de recursos excedido para o perfil do usuário
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      tags: [vms]
      summary: Listar VMs do usuário autenticado
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista de VMs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VM"
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /vms/{id}:
    get:
      tags: [vms]
      summary: Obter detalhes de uma VM
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/VMId"
      responses:
        "200":
          description: Detalhes da VM
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VM"
        "400":
          description: ID de VM inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Acesso negado (VM pertence a outro usuário)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: VM não encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [vms]
      summary: Remover uma VM
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/VMId"
      responses:
        "204":
          description: VM removida com sucesso
        "400":
          description: ID de VM inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Acesso negado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: VM não encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /vms/{id}/start:
    post:
      tags: [vms]
      summary: Ligar uma VM
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/VMId"
      responses:
        "200":
          description: VM iniciada
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: running
        "400":
          description: ID de VM inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Acesso negado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: VM não encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /vms/{id}/reboot:
    post:
      tags: [vms]
      summary: Reiniciar uma VM (shutdown ACPI seguido de start)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/VMId"
      responses:
        "200":
          description: Reinício solicitado
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: running
        "400":
          description: ID de VM inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Acesso negado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: VM não encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /vms/{id}/stop:
    post:
      tags: [vms]
      summary: Desligar uma VM
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/VMId"
      responses:
        "200":
          description: VM parada
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: stopped
        "400":
          description: ID de VM inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Acesso negado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: VM não encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /vms/{id}/terminal:
    get:
      tags: [vms]
      summary: Abrir terminal web da VM (WebSocket)
      description: >-
        Endpoint de upgrade para WebSocket (proxy do termproxy do Proxmox).
        Não é uma requisição HTTP comum — o token JWT deve ser enviado via
        query param `?token=`. Documentado aqui apenas como referência.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/VMId"
      responses:
        "101":
          description: Switching Protocols — conexão WebSocket estabelecida

  /containers/catalog:
    get:
      tags: [containers]
      summary: Catálogo de imagens curadas
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista de imagens do catálogo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CatalogImage"
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /containers:
    post:
      tags: [containers]
      summary: Criar um container no cluster k3s
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateContainerRequest"
      responses:
        "201":
          description: Container criado (pod iniciando)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Container"
        "400":
          description: Payload inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Já existe um container com esse nome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Dados inválidos ou limite de recursos excedido para o perfil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Cluster de containers indisponível
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      tags: [containers]
      summary: Listar containers do usuário autenticado
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista de containers com status vindo do cluster
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Container"
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /containers/{id}:
    get:
      tags: [containers]
      summary: Obter detalhes de um container
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ContainerId"
      responses:
        "200":
          description: Detalhes do container
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Container"
        "400":
          description: ID de container inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Container não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [containers]
      summary: Remover um container
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ContainerId"
      responses:
        "204":
          description: Container removido do cluster e do banco
        "400":
          description: ID de container inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Container não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Cluster de containers indisponível
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Token JWT retornado por /auth/login. Enviar como
        `Authorization: Bearer <token>`.

  parameters:
    VMId:
      name: id
      in: path
      required: true
      description: UUID da VM
      schema:
        type: string
        format: uuid
    ContainerId:
      name: id
      in: path
      required: true
      description: UUID do container
      schema:
        type: string
        format: uuid

  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: mensagem de erro

    RegisterRequest:
      type: object
      required: [email, password, role]
      properties:
        email:
          type: string
          format: email
          example: joao@ifpe.edu.br
        password:
          type: string
          format: password
          minLength: 8
          example: senha1234
        role:
          type: string
          enum: [aluno, pesquisador]
          example: aluno

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: joao@ifpe.edu.br
        password:
          type: string
          format: password
          example: senha1234

    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum: [aluno, pesquisador]

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIs...
        user:
          $ref: "#/components/schemas/UserResponse"

    CreateVMRequest:
      type: object
      required: [name, cpu_cores, memory_mb, disk_gb, os_template]
      properties:
        name:
          type: string
          example: minha-vm
        cpu_cores:
          type: integer
          minimum: 1
          maximum: 16
          example: 2
        memory_mb:
          type: integer
          minimum: 512
          example: 2048
        disk_gb:
          type: integer
          minimum: 4
          example: 20
        os_template:
          type: string
          example: ubuntu-22.04
        pool:
          type: string
        tags:
          type: array
          items:
            type: string
        require_gpu:
          type: boolean
          default: false

    CreateVMResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        proxmox_vm_id:
          type: integer
          example: 100
        name:
          type: string
          example: minha-vm
        status:
          type: string
          example: creating
        websocket_url:
          type: string
          example: /api/vms/{id}/terminal
        credentials:
          type: object
          description: >-
            Presente apenas para VMs Ubuntu, clonadas do template cloud-init.
            Credenciais de login geradas por VM e retornadas uma única vez — não são persistidas.
          properties:
            username:
              type: string
              example: ubuntu
            password:
              type: string
              example: Qm9vdGVkQmVsbw

    VM:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        proxmox_vm_id:
          type: integer
        name:
          type: string
        cpu_cores:
          type: integer
        memory_mb:
          type: integer
        disk_gb:
          type: integer
        os_template:
          type: string
        node:
          type: string
        pool:
          type: string
        tags:
          type: string
          description: Tags separadas por ";" (formato do Proxmox)
        require_gpu:
          type: boolean
        status:
          type: string
          enum: [creating, running, stopped, error]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CatalogImage:
      type: object
      properties:
        key:
          type: string
          example: postgres
        label:
          type: string
          example: PostgreSQL 16
        image:
          type: string
          example: postgres:16
        port:
          type: integer
          description: Porta padrão da imagem; 0 = não expõe (só terminal)
        protocol:
          type: string
          enum: [http, tcp]
        mount_path:
          type: string
          example: /var/lib/postgresql/data
        command:
          type: string
        required_env:
          type: array
          items:
            type: string

    CreateContainerRequest:
      type: object
      required: [name, image, cpu_millis, memory_mb]
      properties:
        name:
          type: string
          description: "1–40 caracteres: minúsculas, dígitos e hífen, sem hífen nas pontas"
          example: meu-pg
        description:
          type: string
        image:
          type: string
          example: postgres:16
        cpu_millis:
          type: integer
          minimum: 100
          example: 500
        memory_mb:
          type: integer
          minimum: 64
          example: 512
        port:
          type: integer
          minimum: 0
          maximum: 65535
          description: 0 = não expor
        protocol:
          type: string
          enum: [http, tcp]
          default: http
        env:
          type: object
          additionalProperties:
            type: string
        command:
          type: string
          description: Executado via /bin/sh -c
        persistent_gb:
          type: integer
          minimum: 0
        mount_path:
          type: string
          description: Caminho absoluto do volume persistente. Default /data

    ContainerStatus:
      type: object
      properties:
        phase:
          type: string
          enum: [pending, running, failed, unknown]
        message:
          type: string

    Container:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        image:
          type: string
        cpu_millis:
          type: integer
        memory_mb:
          type: integer
        port:
          type: integer
        protocol:
          type: string
          enum: [http, tcp]
        node_port:
          type: integer
          description: Porta externa (30000–32767) quando exposto por NodePort; 0 caso contrário
        env:
          type: object
          additionalProperties:
            type: string
        command:
          type: string
        persistent_gb:
          type: integer
        mount_path:
          type: string
        namespace:
          type: string
        status:
          $ref: "#/components/schemas/ContainerStatus"
        external_url:
          type: string
          description: "URL/host:porta de acesso externo; vazio se não exposto"
        internal_address:
          type: string
          description: "<name>:<port> dentro do namespace do usuário"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
